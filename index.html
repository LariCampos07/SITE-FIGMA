<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Game</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>LOGIN</h1>
  <p class="subtitle">Para iniciar seu game<br>preencha os dados e aperte<br>em <strong>ENTRAR</strong></p>

  <div class="input-box">
    <span class="icon">👤</span>
    <input type="text" placeholder="Usuario">
  </div>

  <div class="input-box">
    <span class="icon">🔒</span>
    <input type="password" placeholder="Senha">
  </div>

  <div class="options">
    <label><input type="checkbox"> Lembrar meus dados</label>
    <a href="#">Recuperar senha</a>
  </div>

  <div class="buttons">
    <button class="btn">ENTRAR</button>
    <button class="btn">CADASTRAR</button>
  </div>

  <div class="personagem">
    <img src="./img/personagem.png" alt="Personagem">
  </div>
</div>

</body>
</html>
